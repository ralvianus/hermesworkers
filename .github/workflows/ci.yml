# PR typecheck gate. Pushes to main are deployed (and typechecked) by
# deploy.yml — this workflow only runs on pull requests so main pushes do
# not run duplicate jobs.
#
# Note: do not add docker build/smoke-test jobs back here — the sandbox
# base image's entrypoint runs a persistent server and never exits, so
# `docker run <image> <cmd>` hangs forever (verified the hard way). The
# deploy workflow builds the image for real on every push to main.

name: CI

on:
  pull_request:

jobs:
  typecheck:
    name: Type check Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
